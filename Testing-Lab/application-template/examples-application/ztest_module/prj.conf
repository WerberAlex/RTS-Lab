CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_TEST_LOGGING_DEFAULTS=n

# Shell sans UART : les commandes sont exécutées par le backend « dummy ».
# Le backend série est désactivé pour ne pas se disputer l'UART avec la sortie de Ztest.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=512

CONFIG_LOG=n
